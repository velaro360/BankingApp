name: CI and local Docker deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: velaro360/bankingapp

jobs:
  build-test-publish:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BankingApp.sln

      - name: Build solution
        run: dotnet build BankingApp.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test BankingApp.sln --configuration Release --no-build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-local-runner:
    name: Deploy on local self-hosted runner
    needs: build-test-publish
    runs-on: [self-hosted, bankingapp-deploy]
    permissions:
      contents: read
      packages: read
    environment: local
    env:
      API_IMAGE: ghcr.io/velaro360/bankingapp:${{ github.sha }}
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER || 'bankingapp' }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Add Docker CLI to PATH
        shell: powershell
        run: |
          $dockerDirectory = 'C:\Users\grzeg\AppData\Local\Programs\DockerDesktop\resources\bin'
          $dockerExecutable = Join-Path $dockerDirectory 'docker.exe'

          if (-not (Test-Path $dockerExecutable)) {
            throw "Docker CLI was not found at $dockerExecutable. Install Docker Desktop or update this path."
          }

          $dockerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and start API with SQL Server
        shell: powershell
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans
