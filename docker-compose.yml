services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankingapp-api
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BankingApp;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;MultipleActiveResultSets=true"
      AuthSettings__JwtExpireDays: "3"
      AuthSettings__JwtKey: "priv_bnkapp_sc_key_0704"
      AuthSettings__JwtIssuer: "bankingapp"
    ports:
      - "8080:8080"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankingapp-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
